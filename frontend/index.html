<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro da Studio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <h1>🍅 Pomodoro da Studio</h1>
      <div class="theme-switcher">
        <select id="theme-select">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option>
        </select>
      </div>
    </div>
    <nav class="tabs">
      <button id="nav-timer" class="nav-btn active">Timer</button>
      <button id="nav-stats" class="nav-btn">Statistiche</button>
      <button id="nav-settings" class="nav-btn">Impostazioni</button>
    </nav>
  </header>

  <main>
    <section id="view-timer" class="view active">
      <div class="mode-label" id="mode-label">Focus</div>

      <div class="timer-ring">
        <svg viewBox="0 0 200 200">
          <circle class="ring-bg" cx="100" cy="100" r="90" />
          <circle class="ring-progress" id="ring-progress" cx="100" cy="100" r="90" />
        </svg>
        <div class="time-display" id="time-display">25:00</div>
      </div>

      <div class="subject-row">
        <label for="subject-input">Materia</label>
        <input id="subject-input" type="text" placeholder="es. Matematica" list="subject-list" autocomplete="off" />
        <datalist id="subject-list"></datalist>
      </div>

      <div class="controls">
        <button id="btn-start" class="btn btn-primary">Avvia</button>
        <button id="btn-pause" class="btn" disabled>Pausa</button>
        <button id="btn-reset" class="btn">Reset</button>
        <button id="btn-skip" class="btn btn-ghost">Salta fase</button>
      </div>

      <div class="cycle-info" id="cycle-info">Ciclo 1 di 4</div>
    </section>

    <section id="view-stats" class="view">
      <div class="stats-cards">
        <div class="card">
          <span class="card-value" id="stat-sessions">0</span>
          <span class="card-label">Sessioni completate</span>
        </div>
        <div class="card">
          <span class="card-value" id="stat-time">0h 0m</span>
          <span class="card-label">Tempo totale di studio</span>
        </div>
        <div class="card">
          <span class="card-value" id="stat-streak">0</span>
          <span class="card-label">Streak (giorni consecutivi)</span>
        </div>
      </div>

      <div class="charts">
        <div class="chart-box">
          <h3>Andamento (ultimi 30 giorni)</h3>
          <canvas id="chart-by-day"></canvas>
        </div>
        <div class="chart-box">
          <h3>Tempo per materia</h3>
          <canvas id="chart-by-subject"></canvas>
        </div>
      </div>
    </section>

    <section id="view-settings" class="view">
      <form id="settings-form" class="settings-form">
        <label>
          Durata focus (minuti)
          <input type="number" id="set-focus" min="1" max="180" required />
        </label>
        <label>
          Pausa breve (minuti)
          <input type="number" id="set-short" min="1" max="60" required />
        </label>
        <label>
          Pausa lunga (minuti)
          <input type="number" id="set-long" min="1" max="120" required />
        </label>
        <label>
          Cicli prima della pausa lunga
          <input type="number" id="set-cycles" min="1" max="12" required />
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="set-autostart" />
          Avvia automaticamente la fase successiva
        </label>
        <label>
          Volume suono notifica
          <input type="range" id="set-volume" min="0" max="100" />
        </label>
        <label>
          URL API backend
          <input type="text" id="set-api-base" placeholder="http://localhost:3001/api" />
        </label>
        <button type="submit" class="btn btn-primary">Salva impostazioni</button>
      </form>

      <div class="notif-box">
        <button id="btn-enable-notifications" class="btn">Abilita notifiche desktop</button>
        <p id="notif-status" class="notif-status"></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
